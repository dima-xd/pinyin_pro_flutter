name: pinyin_pro_flutter
description: >-
  A professional Chinese pinyin conversion library for Dart and Flutter.
  Supports tone marks, multiple readings, text matching, HTML generation,
  and custom dictionaries.
version: 1.0.3
homepage: https://github.com/dima-xd/pinyin_pro_flutter
topics:
  - pinyin
  - chinese
  - i18n
  - localization
  - text

environment:
  sdk: ">=3.0.0 <4.0.0"

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
